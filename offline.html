<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a1f3c">
  <title>Vocab World — ออฟไลน์</title>
  <style>
    html,body{height:100%;margin:0;background:#0a1f3c;color:#eaf3ff;font-family:system-ui,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}
    main{max-width:520px}.logo{font-size:56px}h1{color:#ffe9a8;margin:.25em 0}p{line-height:1.6;color:#b8cee7}
    button{border:0;border-radius:999px;background:#e8b64c;color:#10213b;padding:12px 22px;font:700 16px inherit;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">🌍</div>
    <h1>Vocab World ยังต่ออินเทอร์เน็ตไม่ได้</h1>
    <p>ถ้าเคยเปิดเกมบนเครื่องนี้แล้ว ระบบจะพยายามใช้เกมรุ่นล่าสุดที่แคชไว้ โดยข้อมูลผู้เล่นและความคืบหน้าจะไม่ถูกลบ</p>
    <button type="button" onclick="location.reload()">ลองเชื่อมต่ออีกครั้ง</button>
  </main>
</body>
</html>
