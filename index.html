<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Vocab World 🏙️ เมืองคำศัพท์ 3D — เลี้ยงสัตว์ สร้างตัว ผจญภัย</title>
<!-- 🏙️ รอบ 863: หน้านี้ = "หน้าหลัก" ของเกม (ล็อบบี้เมือง 3D · เดิมชื่อ index2.html)
     ล็อบบี้แบบเดิม (แผง/ราง/หน้าจอเกมทั้งหมด) ย้ายไป index_classic.html — สลับไปมาได้ 2 ทาง:
       · ที่นี่ → ปุ่ม "🚪 ล็อบบี้แบบเดิม" มุมล่างซ้าย
       · index_classic.html → ปุ่ม "🏙️ เมือง 3D" บนสุดของรางเมนูซ้าย
     เอนจินทั้งหมดอยู่ js/city3d.js · แตะตึก → เด้งไป index_classic.html?go=<key> (ตัวรับท้าย js/main.js) -->
<link rel="icon" href="img/icons/icon-192-flat.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1f3c">
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a1f3c;
    font-family:system-ui,'Segoe UI',sans-serif;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent}
  canvas{display:block}

  /* ── จอเปิด ── */
  #splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:#0a1f3c;transition:opacity .6s;gap:14px}
  #splash.done{opacity:0;pointer-events:none}
  #splash .logo{font-size:44px}
  #splash .ttl{font-size:26px;font-weight:900;letter-spacing:1px;
    background:linear-gradient(180deg,#ffe9a8,#e8b64c 55%,#c98f2c);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  #splash .sub{color:#8fb4de;font-size:13.5px}
  #splash .bar{width:180px;height:6px;border-radius:4px;background:#16305c;overflow:hidden}
  #splash .bar i{display:block;height:100%;width:40%;border-radius:4px;background:#e8b64c;
    animation:ld 1.1s ease-in-out infinite}
  @keyframes ld{0%{margin-left:-40%}100%{margin-left:100%}}

  /* 🎬 รอบ 880: กลับจากล็อบบี้เดิม → จอเปิด = ภาพเมืองใบที่เพิ่งเดินออกไป (แทนจอน้ำเงินเปล่า)
     แล้วค่อยจางเข้าฉาก 3D จริง · ภาพ+มุมกล้องฝากมาจาก js/city3d.js (sessionStorage vwCityBack) */
  #splash.photo{transition:opacity .9s;justify-content:flex-end;padding-bottom:9vh;gap:10px}
  #splash-shot{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
  #splash.photo::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(10,31,60,0) 40%,rgba(10,31,60,.75))}
  #splash.photo .logo,#splash.photo .ttl{display:none}
  #splash.photo .sub{position:relative;color:#eaf3ff;font-weight:800;font-size:14px;
    background:rgba(10,26,54,.62);border:1px solid rgba(120,190,255,.35);
    border-radius:999px;padding:6px 14px;backdrop-filter:blur(6px)}
  #splash.photo .bar{position:relative}

  /* ── HUD ── */
  .chip{position:fixed;z-index:20;background:rgba(10,26,54,.78);color:#eaf3ff;border:1px solid rgba(120,190,255,.35);
    border-radius:999px;padding:7px 14px;font-size:13px;backdrop-filter:blur(6px);display:flex;gap:8px;align-items:center}
  #city-chip{top:calc(8px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));font-weight:800}
  #city-chip small{font-weight:600;color:#8fb4de}
  #online-chip{top:calc(8px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right))}
  #back-chip{bottom:calc(10px + env(safe-area-inset-bottom));left:calc(10px + env(safe-area-inset-left));
    text-decoration:none;color:#eaf3ff}
  #hint-chip{bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    transition:opacity .8s;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
  #hint-chip.gone{opacity:0;pointer-events:none}

  /* ── 🎵 ปุ่มเพลงประกอบ (รอบ 873) — กลมน่ารัก ลอยเด้งเบาๆ มุมขวาล่าง ── */
  #bgm-btn{position:fixed;z-index:20;right:calc(10px + env(safe-area-inset-right));
    bottom:calc(10px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;
    font-size:24px;line-height:1;border:3px solid #fff;cursor:pointer;padding:0;
    background:linear-gradient(180deg,#ffe9a8,#ffb300);
    box-shadow:0 4px 14px rgba(0,0,0,.35), inset 0 -3px 0 rgba(0,0,0,.12);
    animation:bgmBob 2.6s ease-in-out infinite}
  #bgm-btn:active{transform:scale(.88)}
  #bgm-btn.off{background:linear-gradient(180deg,#e3eaf4,#9fb0c8);filter:saturate(.4);opacity:.85;animation:none}
  @keyframes bgmBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

  /* ── การ์ดโปรไฟล์ผู้เล่น ── */
  #profile-card{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
    background:rgba(4,10,24,.45)}
  .pc-box{position:relative;width:min(320px,86vw);max-height:92vh;overflow:auto;border-radius:22px;
    background:linear-gradient(180deg,#132b56,#0d1f40);border:2px solid rgba(232,182,76,.65);
    box-shadow:0 18px 60px rgba(0,0,0,.55);padding:18px 18px 16px;text-align:center;color:#eaf3ff}
  .pc-x{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;
    background:rgba(255,255,255,.12);color:#fff;font-size:16px;cursor:pointer}
  .pc-img{width:92px;height:118px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
  .pc-name{font-size:19px;font-weight:900;margin-top:4px;word-break:break-word}
  .pc-grade{font-size:15px;margin-top:2px}
  .pc-act{font-size:13px;color:#9fc3ea;margin:6px 0 4px}
  .pc-rows{margin-top:8px;border-top:1px dashed rgba(150,190,240,.3);padding-top:8px;display:flex;
    flex-direction:column;gap:5px;font-size:13.5px}
  .pc-rows div{display:flex;justify-content:space-between;gap:10px}
  .pc-rows span{color:#9fc3ea}
  .pc-me{margin-top:8px;font-size:12.5px;color:#ffd764;font-weight:700}
  .pc-chat{margin-top:10px;width:100%;border:0;border-radius:12px;padding:10px 12px;cursor:pointer;
    background:linear-gradient(180deg,#ffd764,#e0a731);color:#3a2606;font-weight:900;font-size:14px}
  /* จอเตี้ย (มือถือแนวนอน) — กฎทองข้อ 7: การ์ดทั้งใบต้องอยู่ในจอ ไม่มี scrollbar */
  @media (max-height:430px){
    .pc-box{padding:10px 14px 10px}
    .pc-img{width:56px;height:72px}
    .pc-name{font-size:16px;margin-top:2px}
    .pc-grade{font-size:13px}
    .pc-act{font-size:11.5px;margin:3px 0 2px}
    .pc-rows{margin-top:4px;padding-top:4px;gap:2px;font-size:12px}
    .pc-me{margin-top:4px;font-size:11px}
    .pc-chat{margin-top:6px;padding:7px 10px;font-size:13px}
  }

  /* ── 💬 รอบ 868: กล่องพิมพ์ตอบแชทจากในเมือง (แตะบับเบิล/ตัวละคร → เด้งขึ้นมาล่างจอ) ── */
  #chat-box{position:fixed;left:0;right:0;bottom:0;z-index:45;display:none;justify-content:center;
    padding:0 8px calc(8px + env(safe-area-inset-bottom))}
  .cb-card{position:relative;width:min(460px,96vw);border-radius:18px 18px 12px 12px;
    background:linear-gradient(180deg,#14315f,#0c1e3e);border:2px solid rgba(232,182,76,.6);
    box-shadow:0 -8px 34px rgba(0,0,0,.5);padding:10px 12px 10px;color:#eaf3ff}
  .cb-x{position:absolute;top:6px;right:8px;width:28px;height:28px;border-radius:50%;border:0;
    background:rgba(255,255,255,.12);color:#fff;font-size:14px;cursor:pointer}
  .cb-who{font-size:15px;font-weight:900;padding-right:34px;display:block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cb-last{margin-top:5px;font-size:12.5px;color:#bcd6f4;background:rgba(255,255,255,.08);
    border-radius:10px;padding:6px 9px;max-height:3.4em;overflow:hidden}
  /* 🖊️💬 รอบ 872 ต่อยอด: ปุ่มตอบด่วน — ห่อบรรทัดเอง ไม่ต้องเลื่อน (กฎทอง 7) */
  .cb-quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .cb-qchip{border:1px solid rgba(255,215,100,.45);border-radius:999px;padding:5px 12px;
    font-size:12.5px;font-weight:800;color:#ffe9ad;background:rgba(255,255,255,.09);
    cursor:pointer;white-space:nowrap;font-family:inherit}
  .cb-qchip:active{background:rgba(255,215,100,.3)}
  .cb-qchip:disabled{filter:grayscale(.7);opacity:.55;cursor:default}
  .cb-row{display:flex;gap:7px;margin-top:8px}
  .cb-row input{flex:1;min-width:0;border-radius:11px;border:1px solid rgba(150,200,255,.35);
    background:rgba(255,255,255,.95);color:#12233f;font-size:15px;padding:9px 11px;font-family:inherit}
  .cb-row button{border:0;border-radius:11px;padding:0 16px;font-size:14px;font-weight:900;cursor:pointer;
    background:linear-gradient(180deg,#ffd764,#e0a731);color:#3a2606}
  .cb-row button:disabled{filter:grayscale(.7);opacity:.6;cursor:default}
  .cb-note{margin-top:6px;font-size:12px;color:#ffd764;min-height:1.1em}
  .cb-go{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:800;text-decoration:none;
    color:#0d1f40;background:#9fd0ff;border-radius:10px;padding:6px 11px}
  @media (max-height:430px){
    .cb-card{padding:7px 10px 8px}
    .cb-who{font-size:13.5px}
    .cb-last{font-size:11.5px;padding:4px 8px;max-height:2.4em}
    .cb-quick{gap:4px;margin-top:5px}
    .cb-qchip{font-size:11px;padding:4px 10px}
    .cb-row{margin-top:5px}
    .cb-row input{font-size:13.5px;padding:6px 9px}
    .cb-note{font-size:11px}
  }
</style>
</head>
<body>
  <div id="splash">
    <div class="logo">🏙️</div>
    <div class="ttl">VOCAB CITY</div>
    <div class="sub">กำลังสร้างเมืองคำศัพท์ให้หนู…</div>
    <div class="bar"><i></i></div>
  </div>
  <!-- 🎬 รอบ 880: จอเปิดตอน "กลับจากล็อบบี้เดิม" = ภาพเมืองใบที่ถ่ายไว้ตอนเดินเข้าตึก
       วางไว้ตรงนี้ (ก่อนโหลด three.js/city3d.js) เพราะต้องขึ้นให้ทันแว้บแรกที่หน้าเปิด
       ภาพฝากมาใน sessionStorage vwCityBack โดย captureCityShot() ใน js/city3d.js
       โชว์เฉพาะ "เพิ่งออกมาจากตึกนั้นจริง ๆ" (bk ตรงกับ vwCityLastDoor ของรอบ 870) + ภาพสดไม่เกิน 5 นาที
       ใช้ครั้งเดียวแล้วลบ — รีเฟรชเองทีหลังจะได้ไม่เจอภาพเก่าค้าง · ตัวจางออก/ตั้งกล้องอยู่ใน js/city3d.js -->
  <script>
    (function(){
      try{
        var raw = sessionStorage.getItem('vwCityBack');
        if(!raw) return;
        sessionStorage.removeItem('vwCityBack');
        var s = JSON.parse(raw);
        if(!s || !s.img || Date.now()-s.ts > 5*60*1000) return;
        if(s.bk && s.bk !== sessionStorage.getItem('vwCityLastDoor')) return;   // ไม่ได้กลับมาจากตึกใบนั้น = ไม่ใช่ฉากเดียวกัน
        var sp = document.getElementById('splash');
        if(!sp) return;
        var im = document.createElement('div');
        im.id = 'splash-shot';
        im.style.backgroundImage = 'url("'+s.img+'")';
        sp.insertBefore(im, sp.firstChild);
        sp.classList.add('photo');
        var sub = sp.querySelector('.sub');
        if(sub) sub.textContent = '🚪 กำลังกลับเข้าเมือง…';
        window.__vwBackShot = s;        // js/city3d.js เอาไปตั้งมุมกล้องให้ตรงภาพ แล้วสั่งจางออก
      }catch(e){}
    })();
  </script>

  <div class="chip" id="city-chip">🏙️ Vocab City <small>เมืองล็อบบี้ 3D</small></div>
  <div class="chip" id="online-chip">⏳ กำลังเชื่อมต่อ…</div>
  <a class="chip" id="back-chip" href="index_classic.html">🚪 ล็อบบี้แบบเดิม</a>
  <div class="chip" id="hint-chip">🖐️ นิ้วเดียวลาก = เลื่อนเมือง · ✌️ สองนิ้วบิด/ลาก/หนีบ = หมุน·เอียง·ซูม · แตะตึกเพื่อเข้าเลย!</div>

  <div id="profile-card"></div>
  <!-- 💬 รอบ 868: กล่องพิมพ์ตอบแชทในเมือง (เนื้อในเจนจาก js/city3d.js → chatBoxRefresh) -->
  <div id="chat-box"></div>

  <script src="js/vendor/three.min.js"></script>
  <script src="js/data/firebase-config.js"></script>
  <!-- 🙊 รอบ 868: ตัวกรองคำหยาบชุดเดียวกับทั้งเกม (standalone ไม่พึ่งไฟล์อื่น) — ใช้ทั้งก่อนแสดงบับเบิลและก่อนส่ง -->
  <script src="js/data/badwords.js"></script>
  <script src="js/city3d.js?v=880"></script>
  <script>
    setTimeout(()=>{ const h=document.getElementById('hint-chip'); if(h) h.classList.add('gone'); }, 12000);
    document.getElementById('profile-card').addEventListener('click', e=>{
      if(e.target.id==='profile-card') e.target.style.display='none';
    });
    /* PWA: หน้านี้เป็น start_url ของแอพแล้ว (รอบ 863) → ต้องลงทะเบียน Service Worker เองด้วย
       ไม่งั้นคนที่เปิดแอพ/เว็บแล้วไม่กดเข้าล็อบบี้เดิมเลย จะไม่มีแคชออฟไลน์ */
    if('serviceWorker' in navigator && location.protocol.startsWith('http')){
      window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
    }
  </script>

  <!-- ✨ รอบ 876: แถบ "มีเกมเวอร์ชันใหม่" (ผู้ใช้สั่ง: เอาแบบล็อบบี้เดิมมาใส่เมือง 3D ด้วย)
       ตรรกะเดียวกับ index_classic.html: เทียบ version.json ทุก 3 นาที · ครั้งแรกจำเวอร์ชันที่รัน (ไม่เด้งหลอก)
       server เปลี่ยนเมื่อไหร่ → เด้งแถบให้กดรีโหลด · หน้านี้ไม่โหลด css/style.css เลยแนบ CSS หน้าตาเดิมมาในนี้ -->
  <style>
    .update-banner{
      position:fixed;left:50%;bottom:16px;transform:translateX(-50%);
      display:flex;align-items:center;gap:10px;
      background:linear-gradient(135deg,#123a6b,#1e5aa8);color:#fff;
      padding:9px 12px 9px 18px;border-radius:999px;
      box-shadow:0 6px 20px rgba(0,0,0,.35);
      font-size:15px;white-space:nowrap;max-width:94vw;
      z-index:120;animation:ubFadeIn .3s;
      font-family:system-ui,'Segoe UI',sans-serif}
    .update-banner span{font-weight:bold}
    .update-banner button{border:none;cursor:pointer;border-radius:999px;font-size:14px;font-family:inherit}
    #update-reload{background:linear-gradient(135deg,#ffcf5c,#ffb01f);color:#5a3d00;font-weight:bold;padding:7px 14px}
    #update-dismiss{background:rgba(255,255,255,.18);color:#fff;width:28px;height:28px;padding:0;line-height:1}
    @keyframes ubFadeIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  </style>
  <script>
  (function(){
    if(!location.protocol.startsWith('http')) return;   // file:// ข้าม
    var running = null;                                  // เวอร์ชันที่กำลังรันอยู่ (ตั้งจากการเช็กครั้งแรก)
    function fetchVer(){
      return fetch('version.json', {cache:'no-store'})   // no-store = ไม่เอาจาก HTTP cache (network-first ใน SW ดึงสดให้)
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){ return d && d.v != null ? String(d.v) : null; })
        .catch(function(){ return null; });              // ออฟไลน์/ล้มเหลว → null (ไม่เด้งหลอก)
    }
    function showBanner(){
      if(document.getElementById('update-banner')) return;   // โชว์อยู่แล้ว
      var b = document.createElement('div');
      b.id = 'update-banner'; b.className = 'update-banner';
      b.innerHTML = '<span>✨ มีเกมเวอร์ชันใหม่!</span>'
        + '<button id="update-reload">🔄 อัปเดตเลย</button>'
        + '<button id="update-dismiss" aria-label="ปิด">✕</button>';
      document.body.appendChild(b);
      b.querySelector('#update-reload').onclick = function(){ location.reload(); };
      b.querySelector('#update-dismiss').onclick = function(){ b.remove(); };
    }
    function check(){
      if(document.hidden) return;                        // อยู่แท็บอื่น → ข้าม
      fetchVer().then(function(v){
        if(!v) return;
        if(running === null){ running = v; return; }     // ครั้งแรก = จำเวอร์ชันที่กำลังรัน (ไม่เด้ง)
        if(v !== running) showBanner();                  // server เปลี่ยน → มีอัปเดต
      });
    }
    window.addEventListener('load', check);
    setInterval(check, 3 * 60 * 1000);                   // เช็กทุก 3 นาที
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) check(); });
    window.addEventListener('online', check);            // กลับมาออนไลน์ → เช็กทันที
    window.__ubCheck = check;                            // 🧪 test hook (เรียกเช็กทันทีจาก eval)
  })();
  </script>
</body>
</html>
