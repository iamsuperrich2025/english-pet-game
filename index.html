<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Vocab World 🏙️ เมืองคำศัพท์ 3D — เลี้ยงสัตว์ สร้างตัว ผจญภัย</title>
<!-- 🏙️ รอบ 863: หน้านี้ = "หน้าหลัก" ของเกม (ล็อบบี้เมือง 3D · เดิมชื่อ index2.html)
     ล็อบบี้แบบเดิม (แผง/ราง/หน้าจอเกมทั้งหมด) ย้ายไป index_classic.html — สลับไปมาได้ 2 ทาง:
       · ที่นี่ → ปุ่ม "🚪 ล็อบบี้แบบเดิม" มุมล่างซ้าย
       · index_classic.html → ปุ่ม "🏙️ เมือง 3D" บนสุดของรางเมนูซ้าย
     เอนจินทั้งหมดอยู่ js/city3d.js · แตะตึก → เด้งไป index_classic.html?go=<key> (ตัวรับท้าย js/main.js) -->
<link rel="icon" href="img/icons/icon-192-flat.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1f3c">
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a1f3c;
    font-family:system-ui,'Segoe UI',sans-serif;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent}
  canvas{display:block}

  /* ── จอเปิด ── */
  #splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;
    justify-content:center;background:#0a1f3c;transition:opacity .6s;gap:14px}
  #splash.done{opacity:0;pointer-events:none}
  #splash .logo{font-size:44px}
  #splash .ttl{font-size:26px;font-weight:900;letter-spacing:1px;
    background:linear-gradient(180deg,#ffe9a8,#e8b64c 55%,#c98f2c);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  #splash .sub{color:#8fb4de;font-size:13.5px}
  #splash .bar{width:180px;height:6px;border-radius:4px;background:#16305c;overflow:hidden}
  #splash .bar i{display:block;height:100%;width:40%;border-radius:4px;background:#e8b64c;
    animation:ld 1.1s ease-in-out infinite}
  @keyframes ld{0%{margin-left:-40%}100%{margin-left:100%}}

  /* ── HUD ── */
  .chip{position:fixed;z-index:20;background:rgba(10,26,54,.78);color:#eaf3ff;border:1px solid rgba(120,190,255,.35);
    border-radius:999px;padding:7px 14px;font-size:13px;backdrop-filter:blur(6px);display:flex;gap:8px;align-items:center}
  #city-chip{top:calc(8px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));font-weight:800}
  #city-chip small{font-weight:600;color:#8fb4de}
  #online-chip{top:calc(8px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right))}
  #back-chip{bottom:calc(10px + env(safe-area-inset-bottom));left:calc(10px + env(safe-area-inset-left));
    text-decoration:none;color:#eaf3ff}
  #hint-chip{bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    transition:opacity .8s;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
  #hint-chip.gone{opacity:0;pointer-events:none}

  /* ── การ์ดโปรไฟล์ผู้เล่น ── */
  #profile-card{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
    background:rgba(4,10,24,.45)}
  .pc-box{position:relative;width:min(320px,86vw);max-height:92vh;overflow:auto;border-radius:22px;
    background:linear-gradient(180deg,#132b56,#0d1f40);border:2px solid rgba(232,182,76,.65);
    box-shadow:0 18px 60px rgba(0,0,0,.55);padding:18px 18px 16px;text-align:center;color:#eaf3ff}
  .pc-x{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;
    background:rgba(255,255,255,.12);color:#fff;font-size:16px;cursor:pointer}
  .pc-img{width:92px;height:118px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
  .pc-name{font-size:19px;font-weight:900;margin-top:4px;word-break:break-word}
  .pc-grade{font-size:15px;margin-top:2px}
  .pc-act{font-size:13px;color:#9fc3ea;margin:6px 0 4px}
  .pc-rows{margin-top:8px;border-top:1px dashed rgba(150,190,240,.3);padding-top:8px;display:flex;
    flex-direction:column;gap:5px;font-size:13.5px}
  .pc-rows div{display:flex;justify-content:space-between;gap:10px}
  .pc-rows span{color:#9fc3ea}
  .pc-me{margin-top:8px;font-size:12.5px;color:#ffd764;font-weight:700}
  /* จอเตี้ย (มือถือแนวนอน) — กฎทองข้อ 7: การ์ดทั้งใบต้องอยู่ในจอ ไม่มี scrollbar */
  @media (max-height:430px){
    .pc-box{padding:10px 14px 10px}
    .pc-img{width:56px;height:72px}
    .pc-name{font-size:16px;margin-top:2px}
    .pc-grade{font-size:13px}
    .pc-act{font-size:11.5px;margin:3px 0 2px}
    .pc-rows{margin-top:4px;padding-top:4px;gap:2px;font-size:12px}
    .pc-me{margin-top:4px;font-size:11px}
  }
</style>
</head>
<body>
  <div id="splash">
    <div class="logo">🏙️</div>
    <div class="ttl">VOCAB CITY</div>
    <div class="sub">กำลังสร้างเมืองคำศัพท์ให้หนู…</div>
    <div class="bar"><i></i></div>
  </div>

  <div class="chip" id="city-chip">🏙️ Vocab City <small>เมืองล็อบบี้ 3D</small></div>
  <div class="chip" id="online-chip">⏳ กำลังเชื่อมต่อ…</div>
  <a class="chip" id="back-chip" href="index_classic.html">🚪 ล็อบบี้แบบเดิม</a>
  <div class="chip" id="hint-chip">🖐️ นิ้วเดียวลาก = เลื่อนเมือง · ✌️ สองนิ้วบิด/ลาก/หนีบ = หมุน·เอียง·ซูม · แตะตึกเพื่อเข้าเลย!</div>

  <div id="profile-card"></div>

  <script src="js/vendor/three.min.js"></script>
  <script src="js/data/firebase-config.js"></script>
  <script src="js/city3d.js?v=867"></script>
  <script>
    setTimeout(()=>{ const h=document.getElementById('hint-chip'); if(h) h.classList.add('gone'); }, 12000);
    document.getElementById('profile-card').addEventListener('click', e=>{
      if(e.target.id==='profile-card') e.target.style.display='none';
    });
    /* PWA: หน้านี้เป็น start_url ของแอพแล้ว (รอบ 863) → ต้องลงทะเบียน Service Worker เองด้วย
       ไม่งั้นคนที่เปิดแอพ/เว็บแล้วไม่กดเข้าล็อบบี้เดิมเลย จะไม่มีแคชออฟไลน์ */
    if('serviceWorker' in navigator && location.protocol.startsWith('http')){
      window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
    }
  </script>
</body>
</html>
