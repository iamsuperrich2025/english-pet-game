<script>

window.saveState=()=>{window.__saved=JSON.parse(JSON.stringify(state));window.__saveCount=(window.__saveCount||0)+1};window.authPushSave=()=>{window.__pushCount=(window.__pushCount||0)+1;return Promise.resolve()};window.renderDashboard=()=>{};window.clearWarnToasts=()=>{};window.toast=msg=>{window.__lastToast=msg};

<script>

const qaButton=document.createElement('button');qaButton.id='qa-run';qaButton.textContent='RUN PHASE 5 QA';qaButton.style.cssText='position:fixed;right:8px;bottom:8px;z-index:4000;padding:7px 10px;border:2px solid #fff;border-radius:12px;background:#244a9a;color:#fff;font-weight:900';document.body.appendChild(qaButton);

const qaMetrics=document.createElement('output');qaMetrics.id='qa-metrics';qaMetrics.style.display='none';document.body.appendChild(qaMetrics);
let qaFps=0,qaWorst=0,qaFrames=0,qaFrameAt=performance.now(),qaWindowAt=qaFrameAt;function qaFrame(t){const d=t-qaFrameAt;qaFrameAt=t;qaFrames++;qaWorst=Math.max(qaWorst,d);if(t-qaWindowAt>=1000){qaFps=qaFrames*1000/(t-qaWindowAt);qaFrames=0;qaWindowAt=t;}requestAnimationFrame(qaFrame)}requestAnimationFrame(qaFrame);
setInterval(()=>{const t=window.SkyPlayground3D&&SkyPlayground3D._t;if(!t||!t.running)return;qaMetrics.textContent=JSON.stringify({p:{x:t.player.pos.x,y:t.player.pos.y,z:t.player.pos.z},c:{x:t.camera.position.x,y:t.camera.position.y,z:t.camera.position.z},perf:t.perf(),fps:+qaFps.toFixed(1),worstMs:+qaWorst.toFixed(1)});qaWorst=0;},80);
qaButton.addEventListener('click',async()=>{
  let t=SkyPlayground3D._t;const out={},wait=ms=>new Promise(r=>setTimeout(r,ms)),fits=sel=>{const el=document.querySelector(sel),root=document.querySelector('#sp-root'),r=el&&el.getBoundingClientRect();return !!r&&r.left>=0&&r.top>=0&&r.right<=innerWidth+.5&&r.bottom<=innerHeight+.5&&el.scrollHeight<=el.clientHeight&&root.scrollHeight<=root.clientHeight&&root.scrollWidth<=root.clientWidth;};
  try{
    out.daily=Array.isArray(t.daily.missions)&&t.daily.missions.length===3&&new Set(t.daily.missions.map(m=>m.kind)).size===3&&document.querySelectorAll('#sp-missions span').length===3;
    out.towerLandmark=t.towerFloors.length===6;
    const y=t.player.pos.y;document.querySelector('#sp-jump').dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,pointerId:91}));for(let i=0;i<5;i++)t.frame(16);out.jump=t.player.pos.y>y;
    t.checkpoint(1);t.fall();out.respawn=Math.abs(t.player.pos.x-t.checkpoints[1].pos.x)<.2&&Math.abs(t.player.pos.z-(t.checkpoints[1].pos.z+1.8))<.2;

    t.openGate();for(const b of document.querySelectorAll('#sp-gate-options button')){if(t.gate.open)break;b.click();}out.gate=t.gate.open;
    t.peer('friend-qa',{n:'เพื่อน QA',x:2,y:.5,z:2,yaw:0,av:'blk3',m:1,w:2,hp:'S1:0:0'});out.peer=!!t.peers['friend-qa'];t.gone('friend-qa');out.peerGone=!t.peers['friend-qa'];
    for(let i=1;i<=5;i++)t.peer(`crowd-${i}`,{n:`Player ${i}`,x:i,y:.5,z:i,yaw:0,av:`blk${i+1}`,hp:'S3:P:0:0:0:plaza'});out.sixPlayers=Object.keys(t.peers).length===5;for(let i=1;i<=5;i++)t.gone(`crowd-${i}`);
    t.openClass();out.classSetupFit=fits('.sp-class-card');document.querySelector('#sp-pack-name').value='QA Lesson';document.querySelector('#sp-class-time').value='30';document.querySelector('#sp-pack-save').click();out.packSaved=t.teacherData.packs.length===1&&JSON.parse(localStorage.getItem('vocabSkyTeacher_v1')).packs[0].name==='QA Lesson';out.packReload=document.querySelector('#sp-pack-select').value===t.teacherData.packs[0].id;document.querySelector('#sp-class-start').click();out.classHost=t.activity==='classroom'&&t.activityRound.role==='host'&&t.activityRound.phase==='ready'&&t.activityRound.words.length===4&&t.activityRound.playlist.length===3&&t.activityRound.seconds===30;out.classWire=t.classWire.length<=60&&t.classWire.startsWith('C5|');out.classHostFit=fits('.sp-class-card');

    t.peer('live-qa',{n:'Live Tower',x:1,y:.5,z:1,yaw:0,av:'blk2',hp:'S3:T:2:2:150:tower-2026-08-22'});out.joinOffer=t.joinOffer&&t.joinOffer.kind==='tower'&&!document.querySelector('#sp-join-live').hidden;t.joinLive();out.joinedInProgress=t.activity==='tower'&&t.activityRound.seed==='tower-2026-08-22';t.gone('live-qa');
    t.startActivity('letter');out.letter=t.activity==='letter'&&t.letters.length>=t.activityRound.word[0].length;
    t.peer('team-qa',{n:'Team QA',x:1,y:.5,z:1,yaw:0,av:'blk2',hp:`S3:L:4:4:25:${t.activityRound.seed}`});out.sharedStanding=document.querySelector('#sp-score').textContent.includes('Team QA');
    const letterCoins=state.coins;for(let guard=0;guard<12&&t.activityRound.progress<t.activityRound.word[0].length;guard++){const ch=t.activityRound.word[0][t.activityRound.progress].toUpperCase(),token=t.letters.find(x=>x.active&&x.ch===ch);if(!token)break;t.player.pos.copy(token.g.position);t.frame(16);}out.letterProgress=`${t.activityRound.progress}/${t.activityRound.word[0].length}`;out.letterComplete=state.coins>letterCoins&&!!state.skyDaily.claims.daily_first;out.coopBadge=!!state.skyProgress.badges.coop;t.gone('team-qa');
    t.startActivity('race');out.race=t.activity==='race'&&t.raceGates.length===3&&t.activityRound.current.options.length===3;
    const raceCoins=state.coins;for(let q=0;q<3;q++){const answer=t.activityRound.current.answer[0],goal=t.raceGates.find(x=>x.word===answer);goal.hitAt=-9999;t.player.pos.set(goal.x,.45,goal.z);t.frame(16);}out.raceComplete=state.coins>=raceCoins+80&&state.skyProgress.activities.race===1;
    out.accuracyBadge=!!state.skyProgress.badges.accuracy;
    t.startActivity('tower');out.tower=t.activity==='tower'&&t.towerQuestion.options.length===3;
    const floorBefore=t.activityRound.progress,coinsBeforeWrong=state.coins,wrong=t.towerQuestion.options.findIndex(x=>x!==t.towerQuestion.answer);t.answerTower(wrong);out.gentleRetry=t.activityRound.progress===floorBefore&&state.coins===coinsBeforeWrong&&document.querySelector('#sp-tower-feedback').textContent.includes('ไม่หักเหรียญ');
    while(t.activity==='tower'&&!t.activityDone&&t.activityRound.progress<6){const q=t.towerQuestion,correct=q.options.indexOf(q.answer);t.answerTower(correct);await wait(310);}out.towerComplete=t.activityRound.progress===6&&state.skyProgress.towerCheckpoint===6&&state.skyProgress.activities.tower===1;
    out.dailyClaims=Object.keys(state.skyDaily.claims).filter(k=>k==='daily_first').length===1&&window.__coinAwards.filter(n=>n===40).length===1&&Object.keys(state.skyDaily.claims).filter(k=>k.startsWith('run_')).length>=3;
    out.badges=!!state.skyProgress.badges.speed&&!!state.skyProgress.badges.accuracy&&!!state.skyProgress.badges.coop;
    t.startActivity('tower');for(let i=0;i<2;i++){const q=t.towerQuestion;t.answerTower(q.options.indexOf(q.answer));await wait(310);}const resume={runId:t.activityRound.runId,progress:t.activityRound.progress,coins:state.coins};SkyPlayground3D.stop();out.firstTeardown=!t.running&&!document.getElementById('sp-root');SkyPlayground3D.start();await wait(60);t=SkyPlayground3D._t;out.reconnect=t.activity==='tower'&&t.activityRound.runId===resume.runId&&t.activityRound.progress===resume.progress&&state.coins===resume.coins;
