<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <base href="../">
  <title>Vocab Sky Playground QA</title>
  <link rel="stylesheet" href="css/skyplay3d.css">
</head>
<body style="margin:0;overflow:hidden;background:#8fd8ff">
<script>
window.state={coins:2500,sound:false,haptic:false,noAnim:false,profAv:'blk6',profileName:'Sky QA',playerAvatar:'female',pets:[{type:'cat',name:'ดาวใส',level:3,sick:false}],active:0};
window.saveState=()=>{};window.authPushSave=()=>Promise.resolve();window.renderDashboard=()=>{};window.clearWarnToasts=()=>{};window.toast=msg=>{window.__lastToast=msg};
window.addCoins=n=>{state.coins+=n};window.questEvent=()=>{};window.todayStr=()=> '2026-08-22';window.activePet=()=>state.pets[state.active]||null;window.petStage=p=>(p||activePet()).level>=3?'adult':'egg';
window.currentPetImg=()=> 'img/cat_adult_normal.png';window.lobbyBlk=()=>state.profAv;window.fmtNum=n=>Math.round(n).toLocaleString();
window.vocabForStudent=()=>[['apple','แอปเปิล'],['cat','แมว'],['cloud','เมฆ'],['book','หนังสือ'],['star','ดาว'],['jump','กระโดด'],['friend','เพื่อน'],['rainbow','สายรุ้ง']];
window.speakWord=w=>{window.__lastSpoken=w};window.Music={suspendBg(){},resumeBg(){}};
</script>
<script src="js/vendor/three.min.js"></script>
<script src="js/skyplay3d.js"></script>
<script>
SkyPlayground3D.start();
if(new URLSearchParams(location.search).has('gate'))setTimeout(()=>SkyPlayground3D._t.openGate(),120);
if(new URLSearchParams(location.search).has('crowd'))setTimeout(()=>{for(let i=1;i<=5;i++)SkyPlayground3D._t.peer(`crowd-${i}`,{n:`Player ${i}`,x:(i-3)*2,y:.5,z:5+i,yaw:i*.3,av:`blk${i+1}`,m:i%2,w:i,hp:'S2:P:0:0:0:plaza'});},120);
const qaButton=document.createElement('button');qaButton.id='qa-run';qaButton.textContent='RUN PHASE 2 QA';qaButton.style.cssText='position:fixed;right:8px;bottom:8px;z-index:4000;padding:7px 10px;border:2px solid #fff;border-radius:12px;background:#244a9a;color:#fff;font-weight:900';document.body.appendChild(qaButton);
const qaReport=document.createElement('pre');qaReport.id='qa-report';qaReport.style.cssText='display:none;position:fixed;inset:8px;z-index:5000;margin:0;padding:14px;overflow:auto;background:#102451;color:#dfffff;border:2px solid #7ef1ff;border-radius:16px;font:700 13px/1.45 monospace;white-space:pre-wrap';document.body.appendChild(qaReport);
const qaMetrics=document.createElement('output');qaMetrics.id='qa-metrics';qaMetrics.style.display='none';document.body.appendChild(qaMetrics);
let qaFps=0,qaWorst=0,qaFrames=0,qaFrameAt=performance.now(),qaWindowAt=qaFrameAt;function qaFrame(t){const d=t-qaFrameAt;qaFrameAt=t;qaFrames++;qaWorst=Math.max(qaWorst,d);if(t-qaWindowAt>=1000){qaFps=qaFrames*1000/(t-qaWindowAt);qaFrames=0;qaWindowAt=t;}requestAnimationFrame(qaFrame)}requestAnimationFrame(qaFrame);
setInterval(()=>{const t=window.SkyPlayground3D&&SkyPlayground3D._t;if(!t||!t.running)return;qaMetrics.textContent=JSON.stringify({p:{x:t.player.pos.x,y:t.player.pos.y,z:t.player.pos.z},c:{x:t.camera.position.x,y:t.camera.position.y,z:t.camera.position.z},perf:t.perf(),fps:+qaFps.toFixed(1),worstMs:+qaWorst.toFixed(1)});qaWorst=0;},80);
qaButton.addEventListener('click',()=>{
  const t=SkyPlayground3D._t,out={};
  try{
    const y=t.player.pos.y;document.querySelector('#sp-jump').dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,pointerId:91}));for(let i=0;i<5;i++)t.frame(16);out.jump=t.player.pos.y>y;
    t.checkpoint(1);t.fall();out.respawn=Math.abs(t.player.pos.x-t.checkpoints[1].pos.x)<.2&&Math.abs(t.player.pos.z-(t.checkpoints[1].pos.z+1.8))<.2;
    const before=state.coins;t.collect(0);out.star=state.coins===before+20&&!!window.__lastSpoken;
    t.openGate();for(const b of document.querySelectorAll('#sp-gate-options button')){if(t.gate.open)break;b.click();}out.gate=t.gate.open;
    t.peer('friend-qa',{n:'เพื่อน QA',x:2,y:.5,z:2,yaw:0,av:'blk3',m:1,w:2,hp:'S1:0:0'});out.peer=!!t.peers['friend-qa'];t.gone('friend-qa');out.peerGone=!t.peers['friend-qa'];
    t.startActivity('letter');out.letter=t.activity==='letter'&&t.letters.length>=t.activityRound.word[0].length;
    const letterCoins=state.coins;for(let guard=0;guard<12&&t.activityRound.progress<t.activityRound.word[0].length;guard++){const ch=t.activityRound.word[0][t.activityRound.progress].toUpperCase(),token=t.letters.find(x=>x.active&&x.ch===ch);if(!token)break;t.player.pos.copy(token.g.position);t.frame(16);}out.letterProgress=`${t.activityRound.progress}/${t.activityRound.word[0].length}`;out.letterComplete=state.coins===letterCoins+60;
    t.peer('team-qa',{n:'Team QA',x:1,y:.5,z:1,yaw:0,av:'blk2',hp:`S2:L:4:4:25:${t.activityRound.seed}`});out.sharedStanding=document.querySelector('#sp-score').textContent.includes('Team QA');t.gone('team-qa');
    t.startActivity('race');out.race=t.activity==='race'&&t.raceGates.length===3&&t.activityRound.current.options.length===3;
    const raceCoins=state.coins;for(let q=0;q<3;q++){const answer=t.activityRound.current.answer[0],goal=t.raceGates.find(x=>x.word===answer);goal.hitAt=-9999;t.player.pos.set(goal.x,.45,goal.z);t.frame(16);}out.raceComplete=state.coins===raceCoins+80;
    t.startActivity('obby');out.obby=t.activity==='obby'&&t.activityRound.progress===0;
    const beforeFinish=state.coins;t.finish();out.finish=state.coins===beforeFinish+100&&state.skyDone.includes('rainbow');
    SkyPlayground3D.stop();out.teardown=!t.running&&!document.getElementById('sp-root');
  }catch(e){out.error=String(e&&e.stack||e);}
  qaReport.textContent=JSON.stringify(out,null,2);qaReport.style.display='block';qaButton.remove();
});
</script>
</body>
</html>
