<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chibi Weapon Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1324;color:#eef6ff;font:14px system-ui}header{height:90px;padding:17px 26px}h1{font-size:25px;margin:0 0 5px}p{margin:0;color:#8fa6c6}#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:0 16px 16px}.card{height:calc((100vh - 120px)/2);min-height:160px;border:1px solid #2e4667;border-radius:18px;background:radial-gradient(ellipse at 50% 40%,#263b57,#111f35 76%);position:relative}.card b,.card small{position:absolute;left:17px;bottom:40px}.card small{bottom:17px;font-size:11px;color:#8ea6c4}canvas{position:fixed;inset:0;pointer-events:none}.badge{color:#a5d4ff;font-size:12px;position:absolute;right:26px;top:28px}</style><header><h1>CHIBI ARSENAL / คลังอาวุธหุ่นรบ</h1><p>สีและรูปทรงประจำหุ่น · กระสุนมีชีวิต · เอฟเฟกต์กลีบดาว</p><span class="badge">10 WEAPON SIGNATURES</span></header><div id="grid"></div><script src="../../js/vendor/three.min.js"></script><script src="../../js/mecha-combat-fx.js"></script><script>
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);document.body.appendChild(renderer.domElement);const views=[];window.fixedTime=null;
for(const [i,s]of MechaCombatFX.styles.entries()){
 const el=document.createElement('div');el.className='card';el.innerHTML='<b>'+String(i+1).padStart(2,'0')+' / '+s.name+'</b><small>'+s.kind.toUpperCase()+' · '+s.id+'</small>';document.querySelector('#grid').appendChild(el);
 const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(35,1,.1,50);camera.position.set(4,4,7);camera.lookAt(0,1,0);
 scene.add(new THREE.HemisphereLight(0xe6f4ff,0x64728a,1.2));const key=new THREE.DirectionalLight(0xffffff,1.1);key.position.set(0,5,6);scene.add(key);
 const fx=MechaCombatFX.create(scene),from=new THREE.Vector3(-1.7,1,0),to=new THREE.Vector3(1.7,1,0);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.25,.035,6,32),new THREE.MeshBasicMaterial({color:s.color}));ring.rotation.y=Math.PI/2;ring.position.copy(from);scene.add(ring);
 const pad=new THREE.Mesh(new THREE.CylinderGeometry(2.5,2.5,.06,48),new THREE.MeshBasicMaterial({color:0x23354a}));pad.position.y=-.02;scene.add(pad);
 const guide=new THREE.Mesh(new THREE.TorusGeometry(2.4,.018,4,64),new THREE.MeshBasicMaterial({color:0x466584}));guide.rotation.x=Math.PI/2;guide.position.y=.02;scene.add(guide);
 fx.fire(s.id,from,to,0,true);views.push({el,scene,camera,fx,id:s.id,from,to,cycle:0});
}
window.views=views;window.renderer=renderer;let start=performance.now();
function render(now){renderer.setSize(innerWidth,innerHeight,false);renderer.setScissorTest(false);renderer.clear();renderer.setScissorTest(true);for(const v of views){const r=v.el.getBoundingClientRect();renderer.setViewport(r.left,innerHeight-r.bottom+75,r.width,r.height-75);renderer.setScissor(r.left,innerHeight-r.bottom+75,r.width,r.height-75);v.camera.aspect=r.width/(r.height-75);v.camera.updateProjectionMatrix();const elapsed=window.fixedTime===null?(now-start)%850:window.fixedTime;if(elapsed<v.cycle){v.fx.fire(v.id,v.from,v.to,0,true);}v.cycle=elapsed;v.fx.tick(elapsed);renderer.render(v.scene,v.camera);}requestAnimationFrame(render)}requestAnimationFrame(render);
</script></html>
