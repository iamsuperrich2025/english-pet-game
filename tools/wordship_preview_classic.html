<!DOCTYPE html>
<meta charset="utf-8">
<title>Word Fleet preview — classic-like (ไม่มี THREE ล่วงหน้า)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../css/wordship.css">
<body style="margin:0;background:#083344">
<script>
/* จำลองหน้า index_classic: ไม่มี window.THREE แต่มี loadScriptOnce เหมือน ui.js จริง */
window.state={student:{grade:'ป.1'},sound:true,wshScore:0,wshWords:0,wshIntro:0,adminAccess:true};
window.isAdmin=()=>true;
window.vocabForStudent=()=>[['cat','แมว'],['dog','สุนัข'],['bird','นก'],['book','หนังสือ'],['fish','ปลา'],['apple','แอปเปิล']];
window.addCoins=()=>{}; window.saveState=()=>{}; window.Music={suspendBg(){},resumeBg(){}};
window.loadScriptOnce=function(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src='../'+src;/* หน้าจริงอยู่ root — preview อยู่ /tools/ จึงเติม ../ */s.addEventListener('load',()=>{s.dataset.loaded='1';res();});s.addEventListener('error',()=>rej(new Error('โหลดไฟล์ไม่สำเร็จ: '+src)));document.head.appendChild(s);});};
</script>
<script src="../js/wordship.js"></script>
<script>WordShip.open();</script>
