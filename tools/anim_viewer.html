<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0;background:#87a8c8}</style></head><body>
<script src="../js/vendor/three.min.js"></script>
<script src="../js/vendor/GLTFLoader.js"></script>
<script>
// ดูแอนิเมชัน GLB: ?src=path/to.glb[&clip=name] — โยน window.seek(t) แล้ว render ผ่าน window.snap()
const q = new URLSearchParams(location.search);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a8c8);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, .9));
const sun = new THREE.DirectionalLight(0xfff2dd, 1.1); sun.position.set(3, 6, 4); scene.add(sun);
const camera = new THREE.PerspectiveCamera(40, 2, .1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
let mixer = null, model = null;
new THREE.GLTFLoader().load('../' + q.get('src'), g => {
  model = g.scene; scene.add(model);
  const box = new THREE.Box3().setFromObject(model), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  const R = Math.max(s.x, s.y, s.z);
  camera.position.set(c.x + R * 1.6, c.y + R * .35, c.z + R * 1.6);
  camera.lookAt(c.x, c.y, c.z);
  const clip = q.get('clip') ? g.animations.find(a => a.name === q.get('clip')) : g.animations[0];
  window.clipNames = g.animations.map(a => a.name);
  if (clip) { mixer = new THREE.AnimationMixer(model); const a = mixer.clipAction(clip); a.play(); mixer.update(0.001); }
  renderer.render(scene, camera);
  window.ready = true;
});
window.seek = t => { if (mixer) { mixer.setTime(0); mixer.update(t); } renderer.render(scene, camera); };
window.snap = () => { renderer.render(scene, camera); return true; };
</script></body></html>
