<!DOCTYPE html>
<meta charset="utf-8">
<title>ดูสไปรต์น้องเดินในกรอบล็อบบี้ (เครื่องมือพัฒนา)</title>
<link rel="stylesheet" href="../css/lobby.css">
<style>
  body{margin:0;background:linear-gradient(#1a3a6b,#0d1e3d);min-height:100vh;
       display:flex;gap:18px;flex-wrap:wrap;align-items:center;justify-content:center;
       font-family:system-ui;padding:24px}
  /* จำลองกรอบเวทีป้าย rank ในล็อบบี้ (ขนาดใกล้ของจริง) */
  .stage-hero{width:420px;height:300px;border-radius:18px;position:relative;overflow:hidden;
              background:radial-gradient(circle at 50% 40%,#2a5590,#12294c);border:2px solid #3a76d8}
  .hero-scene{position:absolute;inset:0;align-items:flex-end;justify-content:center;padding-bottom:26px;--pet-vh:29}
  .ground{position:absolute;left:8%;right:8%;bottom:24px;height:3px;border-radius:9px;
          background:linear-gradient(90deg,transparent,#7fd0ff88,transparent)}
  .lbl{position:absolute;top:8px;left:12px;color:#cfe4ff;font-size:13px;font-weight:600}
</style>

<script>
  // ค่าชุดเดียวกับ PET_ANIM ใน js/ui.js (path เติม ../ เพราะไฟล์นี้อยู่ใน tools/)
  const PET_ANIM = {
    cat:    { file:'../img/anim/pet_cat_walk.webp',    frames:24, fw:172, fh:172, fps:14, roam:true  },
    dog:    { file:'../img/anim/pet_dog_walk.webp',    frames:24, fw:127, fh:165, fps:14, roam:true, flip:true },
    dragon: { file:'../img/anim/pet_dragon_idle.webp', frames:24, fw:147, fh:139, fps:12, roam:true  },
  };
  // ก้อน HTML เดียวกับ petAnimHTML() ใน ui.js (รวม flip แล้ว)
  function petAnimHTML(a){
    const dur = (a.frames / a.fps).toFixed(2);
    const bpx = (100 * a.frames / (a.frames - 1)).toFixed(3);
    return `<div class="pet-stage"><div class="pet-wrap">`
      + `<div class="pet-roam${a.roam===false?' no-roam':''}"><div class="pet-anim" style="`
      + `aspect-ratio:${a.fw}/${a.fh};background-image:url('${a.file}');`
      + `background-size:${a.frames*100}% 100%;--bpx:${bpx}%;`
      + `${a.flip ? 'transform:scaleX(-1);' : ''}`
      + `animation:petWalk ${dur}s steps(${a.frames}) infinite"></div></div>`
      + `</div></div>`;
  }
  document.addEventListener('DOMContentLoaded', ()=>{
    for(const [key,a] of Object.entries(PET_ANIM)){
      const box = document.createElement('div');
      box.className = 'stage-hero';
      box.innerHTML = `<div class="lbl">${key}${a.flip?' · flip':''}${a.roam===false?' · no-roam':''}</div>`
        + `<div class="ground"></div>`
        + `<div class="hero-scene" style="--pet-vh:34">${petAnimHTML(a)}</div>`;
      document.body.appendChild(box);
    }
  });
</script>
